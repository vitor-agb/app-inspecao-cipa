[theme]
font = "sans serif"

[theme.light]
primaryColor = "#2b7a2e"
backgroundColor = "#f3f5f2"
secondaryBackgroundColor = "#ecf0eb"
textColor = "#161d25"

[theme.dark]
primaryColor = "#a4e745"
backgroundColor = "#0e1318"
secondaryBackgroundColor = "#1f2833"
textColor = "#eef2ef"

[ui]
# Define o estado inicial da barra lateral. 
# "collapsed" faz com que ela comece fechada (escondida).
sidebarNavSections = "collapsed"
initialSidebarState = "collapsed"

[server]
headless = true
