[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1B5E20"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#161616"

[theme.dark]
primaryColor = "#A4E745"
backgroundColor = "#161616"
secondaryBackgroundColor = "#1F1F1F"
textColor = "#F2F2F2"

[ui]
# Define o estado inicial da barra lateral. 
# "collapsed" faz com que ela comece fechada (escondida).
sidebarNavSections = "collapsed"
initialSidebarState = "collapsed"

[server]
headless = true
